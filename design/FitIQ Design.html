<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>FitIQ — Hi-Fi Concept Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="direction-a-aurora.jsx"></script>
<script type="text/babel" src="direction-b-graphite.jsx"></script>
<script type="text/babel" src="direction-c-neon.jsx"></script>

<script type="text/babel">
  const PHONE_W = 290;
  const PHONE_H = 628;
  const ART_W = PHONE_W + 24;
  const ART_H = PHONE_H + 24;

  function Phone({ children, dark = true }) {
    return (
      <div style={{ width: ART_W, height: ART_H, display: 'flex', alignItems: 'center', justifyContent: 'center', background: '#1a1a1d' }}>
        <IOSDevice width={PHONE_W} height={PHONE_H} dark={dark}>
          {children}
        </IOSDevice>
      </div>
    );
  }

  const directions = [
    {
      id: 'aurora', title: 'Direction A · Aurora',
      subtitle: 'Indigo + violet glassmorphism, electric cyan. Whoop × Apple Fitness premium.',
      screens: [
        ['splash',   '01 · Splash',          <ASplash />],
        ['goal',     '02 · Goal',            <AOnboardGoal />],
        ['stats',    '03 · Body Stats',      <AOnboardStats />],
        ['diet',     '04 · Diet',            <AOnboardDiet />],
        ['ai',       '05 · AI Analysis',     <AAnalyzing />],
        ['home',     '06 · Home Dashboard',  <AHome />],
        ['workout',  '07 · Workout Plan',    <AWorkout />],
        ['scan',     '08 · Food Scan',       <AFoodScan />],
        ['friends',  '09 · Leaderboard',     <AFriends />],
        ['profile',  '10 · Profile',         <AProfile />],
      ]
    },
    {
      id: 'graphite', title: 'Direction B · Graphite',
      subtitle: 'Linear-inspired charcoal, electric blue, scientific instrument data UI.',
      screens: [
        ['splash',   '01 · Splash',          <BSplash />],
        ['goal',     '02 · Goal',            <BOnboardGoal />],
        ['stats',    '03 · Body Stats',      <BOnboardStats />],
        ['diet',     '04 · Diet',            <BOnboardDiet />],
        ['ai',       '05 · AI Analysis',     <BAnalyzing />],
        ['home',     '06 · Home Dashboard',  <BHome />],
        ['workout',  '07 · Workout Plan',    <BWorkout />],
        ['scan',     '08 · Food Scan',       <BFoodScan />],
        ['friends',  '09 · Leaderboard',     <BFriends />],
        ['profile',  '10 · Profile',         <BProfile />],
      ]
    },
    {
      id: 'neon', title: 'Direction C · Neon Saffron',
      subtitle: 'Brutalist black canvas, acid green primary, saffron accent. Bold display type.',
      screens: [
        ['splash',   '01 · Splash',          <CSplash />],
        ['goal',     '02 · Goal',            <COnboardGoal />],
        ['stats',    '03 · Body Stats',      <COnboardStats />],
        ['diet',     '04 · Diet',            <COnboardDiet />],
        ['ai',       '05 · AI Analysis',     <CAnalyzing />],
        ['home',     '06 · Home Dashboard',  <CHome />],
        ['workout',  '07 · Workout Plan',    <CWorkout />],
        ['scan',     '08 · Food Scan',       <CFoodScan />],
        ['friends',  '09 · Leaderboard',     <CFriends />],
        ['profile',  '10 · Profile',         <CProfile />],
      ]
    },
  ];

  function App() {
    return (
      <DesignCanvas>
        <DCSection id="title" title="FitIQ" subtitle="Premium AI fitness coach for Indian gym-goers · 3 directions × 10 screens">
          <DCArtboard id="brief" label="Brief" width={520} height={628}>
            <div style={{
              width: '100%', height: '100%', padding: 32,
              fontFamily: '"Inter", system-ui, sans-serif',
              background: '#fafaf7', color: '#222', display: 'flex', flexDirection: 'column', gap: 14,
            }}>
              <div style={{ fontFamily: '"JetBrains Mono", monospace', fontSize: 11, letterSpacing: 2, color: '#999' }}>FITIQ · BRIEF</div>
              <div style={{ fontSize: 38, fontWeight: 700, letterSpacing: -1.4, lineHeight: 1, marginTop: -4 }}>
                Your AI fitness coach<br/>that <span style={{ fontStyle: 'italic', fontWeight: 500 }}>gets</span> you.
              </div>
              <div style={{ height: 1, background: '#222', opacity: 0.1, margin: '6px 0' }} />
              <div style={{ fontSize: 13, lineHeight: 1.55, color: '#444' }}>
                Premium dark-themed mobile app for Indian gym-goers (22-35). Three directions explore distinct visual takes on the same product:
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginTop: 4 }}>
                <div style={{ padding: 12, borderRadius: 8, background: '#1a1330', color: '#E8E0FF' }}>
                  <div style={{ fontWeight: 700, fontSize: 14 }}>A · Aurora</div>
                  <div style={{ fontSize: 11, opacity: 0.75, marginTop: 2 }}>Indigo + violet glass · electric cyan · Whoop × Apple Fitness</div>
                </div>
                <div style={{ padding: 12, borderRadius: 8, background: '#0A0B0D', color: '#E8EAED', border: '1px solid #2D3138' }}>
                  <div style={{ fontWeight: 700, fontSize: 14 }}>B · Graphite</div>
                  <div style={{ fontSize: 11, opacity: 0.75, marginTop: 2 }}>Linear charcoal · electric blue · scientific data UI</div>
                </div>
                <div style={{ padding: 12, borderRadius: 8, background: '#050505', color: '#F5F5F2' }}>
                  <div style={{ fontWeight: 700, fontSize: 14, color: '#C8FF3D' }}>C · Neon Saffron</div>
                  <div style={{ fontSize: 11, opacity: 0.75, marginTop: 2 }}>Brutalist black · acid green + saffron · oversized display type</div>
                </div>
              </div>
              <div style={{ marginTop: 'auto', fontFamily: '"JetBrains Mono", monospace', fontSize: 10, color: '#999', letterSpacing: 1 }}>
                10 SCREENS × 3 DIRECTIONS · 30 ARTBOARDS<br/>
                ↔ DRAG TO REORDER · ⤢ TAP TO FOCUS · ←/→ NAVIGATE
              </div>
            </div>
          </DCArtboard>
        </DCSection>

        {directions.map(d => (
          <DCSection key={d.id} id={d.id} title={d.title} subtitle={d.subtitle}>
            {d.screens.map(([id, label, el]) => (
              <DCArtboard key={id} id={`${d.id}-${id}`} label={label} width={ART_W} height={ART_H}>
                <Phone>{el}</Phone>
              </DCArtboard>
            ))}
          </DCSection>
        ))}
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
